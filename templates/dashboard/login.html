<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion · UNILUK</title>
<style>*,*:before,*:after{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071c2b;color:#102b3b;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 15% 15%,#165c7e 0,transparent 32%),radial-gradient(circle at 90% 85%,#d9a426 0,transparent 28%),#071c2b}.card{width:min(440px,calc(100% - 32px));padding:42px;background:#fff;border-radius:24px;box-shadow:0 28px 80px #0008}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:21px;color:#073d57}.mark,.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#e6af24;color:#06354c}.logo{object-fit:contain;background:#f4f7f8;padding:3px}h1{font-size:28px;margin:38px 0 8px}p{color:#617481;line-height:1.5;margin:0 0 28px}label{display:block;font-size:13px;font-weight:700;margin:17px 0 7px}input{width:100%;padding:14px;border:1px solid #dce4e8;border-radius:10px;font:inherit}button{margin-top:26px;width:100%;border:0;border-radius:10px;padding:14px;background:#075271;color:#fff;font:700 15px inherit;cursor:pointer}.error{padding:12px 14px;border-radius:9px;background:#fff0ef;color:#b72f2f;font-size:14px}</style></head>
<body><main class="card"><div class="brand">{% if site_logo %}<img src="{{ site_logo }}" alt="Logo {{ site_name }}" class="logo">{% else %}<span class="mark">U</span>{% endif %}{{ site_name }} <small>· Gestion</small></div><h1>Bon retour</h1><p>Connectez-vous pour administrer le contenu du site.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<label for="username">Nom d’utilisateur</label><input id="username" name="username" required autofocus><label for="password">Mot de passe</label><input id="password" name="password" type="password" required><button>Se connecter</button></form></main></body></html>
